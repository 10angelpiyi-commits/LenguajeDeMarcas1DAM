<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 18: Estados y Modo Oscuro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="antialiased transition-colors duration-300">
    <!-- Nota: Para probar el modo oscuro, añade manualmente la clase 'dark' a la etiqueta <html> o usa el botón de abajo -->

    <div class="min-h-screen flex flex-col items-center justify-center dark:bg-slate-900 bg-gray-50 transition-colors duration-300">

        <button onclick="document.documentElement.classList.toggle('dark')" 
            class="absolute top-5 right-5 px-4 py-2 bg-gray-200 dark:bg-gray-700 dark:text-white rounded shadow text-sm font-semibold hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">
            Alternar Modo Oscuro
        </button>

        <!-- TARJETA INTERACTIVA -->
        <div class="w-full max-w-sm p-6 rounded-2xl shadow-lg transition-all duration-300 border border-gray-100 dark:border-gray-700 bg-white dark:bg-slate-800 hover:scale-105 hover:shadow-xl">
            
            <h2 class="text-2xl font-bold mb-4 text-black dark:text-white">Inicia Sesión</h2>

            <form class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email</label>
                    <input type="email" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg dark:bg-slate-900 dark:text-white dark:border-gray-600 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 dark:focus:ring-blue-800 transition-all" 
                        placeholder="tu@email.com" 
                        value="tu@email.com">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Contraseña</label>
                    <input type="password" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg dark:bg-slate-900 dark:text-white dark:border-gray-600 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 dark:focus:ring-blue-800 transition-all" 
                        placeholder="**********" 
                        value="**********">
                </div>

                <button type="submit" 
                    class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition-colors">
                    Entrar
                </button>
            </form>

            <p class="text-xs text-center mt-6 text-gray-500 dark:text-slate-400">
                ¿No tienes cuenta? <a href="#" 
                    class="text-blue-500 hover:text-blue-400 font-medium underline dark:text-blue-400 dark:hover:text-blue-300">Regístrate</a>
            </p>
        </div>

    </div>
</body>
</html>
